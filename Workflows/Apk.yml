
name: apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Projeyi olustur ve derle
        run: |
          flutter create --org com.ornek --project-name wifi_aktar tmp_app
          cp lib/main.dart tmp_app/lib/main.dart
          cd tmp_app
          flutter pub add file_picker
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: wifi-aktar-apk
          path: tmp_app/build/app/outputs/flutter-apk/app-release.apk
